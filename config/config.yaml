# Configuracion unica del proyecto. Todos los scripts leen de aqui,
# asi no hay rutas ni numeros escritos dentro del codigo.

rutas:
  datos_crudos: data/raw/creditcard.csv
  datos_procesados: data/processed
  modelos: models
  reportes: reports

datos:
  columna_objetivo: Class
  columna_tiempo: Time
  columna_monto: Amount
  columnas_pca: [V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14,
                 V15, V16, V17, V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28]

particion:
  estrategia: temporal        # temporal | aleatoria
  proporcion_entrenamiento: 0.70
  proporcion_validacion: 0.15
  semilla: 42

preprocesamiento:
  escalador: robust           # robust | standard
  log_monto: true             # aplica log(1 + monto)
  hora_del_dia: true          # deriva la hora a partir de Time
  eliminar_duplicados: true

entrenamiento:
  semilla: 42
  semillas_finales: [42, 7, 2024]     # el modelo final promedia una corrida por semilla
  gbdt:                               # XGBoost v2, hiperparametros elegidos con Optuna (30 trials)
    n_estimators: 2000                # tope, la parada temprana corta mucho antes
    parada_temprana: 100
    learning_rate: 0.2655
    max_depth: 10
    min_child_weight: 2.965
    subsample: 0.8945
    colsample_bytree: 0.5648
    gamma: 3.0044
    reg_lambda: 2.954
    exp_peso: 0.9809                  # scale_pos_weight = razon_desbalance ** exp_peso
  red_neuronal:                       # Red MLP v2
    capas: [128, 64, 32]
    dropout: [0.3, 0.3, 0.2]
    learning_rate: 0.001
    weight_decay: 0.01
    batch_size: 2048
    epocas: 40
    paciencia: 8
    parada: val_auprc                 # v1 usaba val_loss
    perdida: focal
    alfa: 0.75
    gamma: 2.0
    embedding: false                  # true activa los embeddings periodicos
    emb_k: 8
    emb_d: 16
    emb_sigma: 0.1

evaluacion:
  metrica_principal: average_precision   # AUPRC
  costo_falso_negativo: 1.0              # fraude que se deja pasar
  costo_falso_positivo: 0.02             # transaccion legitima bloqueada
